# Copy into each HE-owned Hermes profile; profile .env is generated as 0600.
# Runtime: Hermes0.21.6/818c13be. Secret values never belong in this file.
model:
  default: deepseek-flash
  provider: custom:he-model
  context_length: 65536
providers:
  he-model:
    base_url: https://api.deepseek.com/v1
    key_env: HE_ASSISTANT_MODEL_KEY
    default_model: deepseek-flash
    transport: chat_completions
    extra_body:
      max_tokens: 2048
      thinking:
        type: disabled
agent:
  max_turns: 8
  run_budget_seconds: 180
  api_max_retries: 1
  agent_cache:
    max_size: 2
    protect_recent: 0
# Explicitly disable tool-search bridge; verify the actual outbound ten schemas.
tools:
  tool_search:
    enabled: "off"
toolsets: []
platform_toolsets:
  api_server: [he, memory]
gateway:
  multiplex_profiles: true
  auto_multiplex_migration: false
  api_server:
    max_concurrent_runs: 1
mcp_servers:
  he:
    url: http://he-mcp:8020/mcp
    headers:
      Authorization: "Bearer ${HE_TOOL_TOKEN}"
    trust: full
    tools:
      include:
        - search_media
        - get_media_detail
        - get_library_stats
        - recommend_media
        - list_duplicate_candidates
        - list_tags
        - list_folders
        - propose_media_update
        - propose_scan
      resources: false
      prompts: false
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
display:
  interim_assistant_messages: false
