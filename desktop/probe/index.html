<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>HE Manager · 内嵌播放原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0c11;color:#e9e9f2;font:14px system-ui}header{height:66px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #292b36}header small{color:#999dae}main{height:calc(100vh - 66px);display:flex;flex-direction:column;padding:20px;gap:12px}.stage{position:relative;flex:1;min-height:100px;background:#000;overflow:hidden;border-radius:14px;border:1px solid #292b36}canvas{display:block;width:100%;height:100%;object-fit:contain}.overlay{position:absolute;bottom:18px;left:18px;right:18px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#111321e6;border:1px solid #51536a;border-radius:12px;backdrop-filter:blur(10px)}button,select{background:#292c40;color:#fff;border:1px solid #525773;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}button:hover{background:#4b4678}button:focus-visible,select:focus-visible{outline:3px solid #a79bff;outline-offset:2px}#state{height:44px;color:#a9b0c6;font:12px ui-monospace,monospace;overflow:auto}#menu{position:absolute;right:24px;bottom:94px;background:#282a42;border:1px solid #7277a2;border-radius:10px;padding:18px;z-index:5}#menu[hidden]{display:none}.badge{color:#bab0ff;font-weight:700}
</style></head>
<body><header><strong>HE Manager</strong><span class="badge">CP-01</span><small>libmpv → 共享纹理 → 窗口内画面</small></header>
<main><div class="stage"><canvas id="video"></canvas><div id="menu" hidden><button id="menu-action">覆盖菜单输入检查</button></div><div class="overlay"><button id="pause">播放 / 暂停</button><button id="seek">前进 1 秒</button><select id="mode" aria-label="视频增强"><option value="off">原画</option><option value="efficiency">Anime4K 效率</option><option value="quality">Anime4K 质量</option></select><button id="menu-toggle">菜单</button><button id="fullscreen">全屏</button></div></div><div id="state" role="status">等待本机媒体会话…</div></main>
<script src="renderer.js"></script></body></html>
