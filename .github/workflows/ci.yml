name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU-only PyTorch
        run: |
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite
        working-directory: backend
        run: |
          python -m pytest

  frontend-check-and-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Run Frontend Vitest Tests
        working-directory: frontend
        run: |
          npm run test

      - name: Run Vue-TSC & Vite Production Build
        working-directory: frontend
        run: |
          npm run build

  pawchive-windows:
    name: Pawchive Windows Compatibility
    runs-on: windows-latest

    steps:
      - name: Checkout backend and frontend
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend
            frontend

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Pawchive backend tests
        working-directory: backend
        run: python -m pytest tests/test_pawchive_provider.py tests/test_pawchive_streaming.py tests/test_pawchive_downloads.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Pawchive frontend tests and build
        working-directory: frontend
        run: |
          npx vitest run src/__tests__/pawchiveBrowse.test.ts src/__tests__/pawchiveSequence.test.ts
          npm run build
