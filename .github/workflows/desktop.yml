name: Desktop clients
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'frontend/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'frontend/**', '.github/workflows/desktop.yml']
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            os: macos-latest
          - platform: win32
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Install dependencies
        run: npm ci --prefix frontend && npm ci --prefix desktop
      - name: Test
        run: npm test --prefix desktop && npm test --prefix frontend
      - name: Build shared UI
        run: npm run build:ui --prefix desktop
      - name: Verify and prepare native runtimes
        run: python3 desktop/scripts/prepare-runtimes.py ${{ matrix.platform }}
      - name: Package
        run: npm run package --prefix desktop -- ${{ matrix.platform }}
      - name: Ad-hoc sign macOS bundle and refresh archive
        if: matrix.platform == 'darwin'
        run: |
          bash desktop/scripts/sign-macos.sh "desktop/release/HE Manager-darwin-arm64/HE Manager.app"
          python3 desktop/scripts/archive.py "desktop/release/HE Manager-darwin-arm64" "desktop/release/HE-Manager-0.1.0-darwin-arm64.zip" darwin
      - uses: actions/upload-artifact@v4
        with:
          name: he-manager-${{ matrix.platform }}
          path: desktop/release/*.zip
