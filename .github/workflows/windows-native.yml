name: Windows native client
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows-native/**', 'desktop/resources/**', '.github/workflows/windows-native.yml']
  pull_request:
    paths: ['windows-native/**', 'desktop/resources/**', '.github/workflows/windows-native.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows-native/global.json
          cache: true
          cache-dependency-path: windows-native/HEManager.Windows/packages.lock.json
      - name: Locate the MSVC toolchain
        run: |
          $ErrorActionPreference='Stop'
          $vswhere='C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $installations=& $vswhere -all -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          $vs=$installations | Sort-Object {[version]$_.installationVersion} -Descending | Where-Object {
            Test-Path (Join-Path $_.installationPath 'VC/Tools/MSVC/14.44.*')
          } | Select-Object -First 1 -ExpandProperty installationPath
          if(!$vs){throw 'An MSVC 14.44 toolset is required (supported in VS 2022 and VS 2026)'}
          Write-Output "MSVC 14.44 installation: $vs"
          $tools=Join-Path $env:RUNNER_TEMP 'he-native-tools'
          New-Item $tools -ItemType Directory -Force | Out-Null
          New-Item (Join-Path $tools 'BuildTools') -ItemType Junction -Target $vs | Out-Null
          New-Item (Join-Path $tools 'dotnet') -ItemType Junction -Target (Split-Path (Get-Command dotnet).Source) | Out-Null
          "HE_NATIVE_TOOLS=$tools" >> $env:GITHUB_ENV
      - name: Download and verify the locked libmpv build
        run: |
          $lock=Get-Content windows-native/runtime-lock/dependencies.json -Raw | ConvertFrom-Json
          $archive=Join-Path $env:RUNNER_TEMP 'libmpv-dev.7z'
          Invoke-WebRequest $lock.libmpv.url -OutFile $archive
          ./windows-native/scripts/Prepare-Runtime.ps1 -Archive $archive
      - name: Build native graphics and WinUI with locked NuGet dependencies
        run: ./windows-native/scripts/Build.ps1 -Toolchain $env:HE_NATIVE_TOOLS -Locked
      - name: Compile the independent Windows UI tests
        working-directory: windows-native
        run: dotnet build HEManager.UITests/HEManager.UITests.csproj -c Release -o .artifacts/uitests
      - name: Preserve build provenance
        uses: actions/upload-artifact@v4
        with:
          name: he-windows-native-build-info
          path: windows-native/.artifacts/x64/build-info.json
# GPU, desktop input, physical DPI and long-run acceptance execute on the user's
# Windows workstation; a hosted build result does not claim those tests passed.
